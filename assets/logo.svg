<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 108" fill="none">
  <defs>
    <!-- Mark gradient: cyan top-left → blue mid → purple bottom-right -->
    <linearGradient id="gm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#06d6f0"/>
      <stop offset="48%"  stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#7c5ce7"/>
    </linearGradient>
    <!-- 'a' accent: cyan → blue horizontal -->
    <linearGradient id="ga" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00d8f8"/>
      <stop offset="100%" stop-color="#4f8ef7"/>
    </linearGradient>
    <!-- i-dot: blue → purple vertical -->
    <linearGradient id="gd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#5b8ef7"/>
      <stop offset="100%" stop-color="#7c5ce7"/>
    </linearGradient>
  </defs>

  <!-- ══════════════════════════════════════════
       LL PIPELINE MARK  (96 × 96 in 108px tall)
  ══════════════════════════════════════════ -->

  <!-- Outer L – tall vertical left bar -->
  <rect x="6"  y="8"  width="22" height="76" rx="7" fill="url(#gm)"/>
  <!-- Outer L – wide bottom horizontal bar -->
  <rect x="6"  y="62" width="68" height="22" rx="7" fill="url(#gm)"/>

  <!-- Inner L – shorter vertical bar (right, offset down) -->
  <rect x="42" y="20" width="17" height="56" rx="6" fill="url(#gm)"/>
  <!-- Inner L – narrow bottom horizontal -->
  <rect x="42" y="60" width="42" height="17" rx="6" fill="url(#gm)"/>

  <!-- Arrow connector at junction (right-pointing triangle) -->
  <path d="M60 43 L77 52 L60 61 Z" fill="url(#gm)"/>

  <!-- ══════════════════════════════════════════
       WORDMARK  –  LeadaLine
       Single <text> with <tspan> so letters
       flow continuously with zero gap.
  ══════════════════════════════════════════ -->
  <text y="80"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="56"
        font-weight="800"
        letter-spacing="-1.5">
    <tspan x="112" fill="#ffffff">Lead</tspan><tspan fill="url(#ga)">a</tspan><tspan fill="#ffffff">L</tspan><tspan fill="#ffffff" dx="0">ine</tspan>
  </text>

  <!-- i-dot override: white circle erases natural dot, gradient circle replaces it -->
  <!-- 'i' position after "LeadaL" ≈ 112 + 168 + 34 = 314; i-center-x ≈ 323 -->
  <!-- i-dot y ≈ baseline(80) – 50 = 30 -->
  <circle cx="323" cy="29" r="10" fill="#050c1e"/>
  <circle cx="323" cy="29" r="8"  fill="url(#gd)"/>
</svg>
